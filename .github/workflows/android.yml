name: Android checks
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Stamp the build number
        run: echo "NEXUSCP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Unit tests and lint
        continue-on-error: true
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - name: Debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Verify debug APK
        if: always()
        run: |
          set -euo pipefail
          APK=$(ls build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package:|^minSdkVersion:|^targetSdkVersion:|^application-label:" || true
          if unzip -l "$APK" | grep -E "offline-mfi"; then
            echo "ERROR: offline-mfi assets must not be packaged; identity is embedded in source" >&2
            exit 1
          fi
          echo "offline-mfi assets: absent (expected)"
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nexuscp-debug-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "NEXUSCP_RELEASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "NEXUSCP_RELEASE_ENABLED=true"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6
      - name: Stamp the build number
        run: echo "NEXUSCP_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Signed release APK
        if: env.NEXUSCP_RELEASE_ENABLED == 'true'
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload release APK
        if: env.NEXUSCP_RELEASE_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nexuscp-release-apk
          path: build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Publish GitHub release
        if: env.NEXUSCP_RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(ls build/outputs/apk/release/*.apk | head -1)
          TAG="v2.0-${GITHUB_RUN_NUMBER}"
          NAME="NexusCP-2.0-${GITHUB_RUN_NUMBER}.apk"
          cp "$APK" "$NAME"
          gh release create "$TAG" "$NAME" \
            --title "Nexus CP 2.0（${GITHUB_RUN_NUMBER}）" \
            --notes "Nexus CP release build ${GITHUB_RUN_NUMBER}."
